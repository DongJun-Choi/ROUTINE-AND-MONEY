<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카테고리 나누기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#A6ABB3;font-family:'Inter','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
button,input,select{font:inherit}
a{color:#1D4ED8;text-decoration:none}a:hover{color:#1E40AF}
:focus-visible{outline:3px solid rgba(29,78,216,0.35);outline-offset:2px}
input:focus,select:focus{outline:none;border-color:#1D4ED8 !important;box-shadow:0 0 0 3px rgba(29,78,216,0.15)}
.money-field:focus-within{border-color:#1D4ED8 !important;box-shadow:0 0 0 3px rgba(29,78,216,0.15)}
.money-field input:focus{box-shadow:none}
</style>
</helmet>
<div style="width: 800px; height: 820px; padding: 32px; background: #A6ABB3; display: flex; align-items: center; justify-content: center; color: #0F172A; font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.005em">
<section role="dialog" aria-modal="true" aria-labelledby="split-title" style="width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.03); padding: 24px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #EFF4FF; color: #1D4ED8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M8 3H3v5"></path><path d="M12 22v-8.3a4 4 0 0 0-1.17-2.87L3 3"></path><path d="m15 9 6-6"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h2 id="split-title" style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em">카테고리 나누기</h2>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #64748B">이마트 성수점 54,000원을 품목별로 나누고 카테고리를 정해요</p>
</div>
</div>
<a href="TransactionDetail.dc.html" aria-label="닫기" style="width: 44px; height: 44px; margin: -6px -8px 0 0; border-radius: 10px; color: #334155; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</a>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<div aria-hidden="true" style="display: grid; grid-template-columns: minmax(0, 1fr) 140px 200px 44px; gap: 8px; padding: 0 9px; font-size: 12px; line-height: 16px; font-weight: 600; color: #64748B">
<span style="padding-left: 18px">항목</span>
<span style="text-align: right; padding-right: 12px">금액</span>
<span>카테고리</span>
<span></span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<li style="display: grid; grid-template-columns: minmax(0, 1fr) 140px 200px 44px; gap: 8px; align-items: center; padding: 8px; border: 1px solid #E2E8F0; border-radius: 12px; background: #FFFFFF">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{r.color}}; flex: 0 0 auto"></span>
<input type="text" aria-label="{{r.labelAria}}" value="{{r.label}}" onChange="{{r.setLabel}}" placeholder="{{r.placeholder}}" style="flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFFFFF; color: #0F172A; font-size: 14px">
</span>
<span class="money-field" style="display: flex; align-items: center; height: 44px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFFFFF">
<input type="text" inputMode="numeric" aria-label="{{r.amountAria}}" value="{{r.amountText}}" onChange="{{r.setAmount}}" style="flex: 1 1 auto; min-width: 0; height: 100%; padding: 0 4px 0 10px; border: 0; border-radius: 8px; background: transparent; color: #0F172A; font-size: 14px; font-weight: 600; text-align: right">
<span style="padding: 0 12px 0 2px; font-size: 13px; color: #64748B">원</span>
</span>
<select aria-label="{{r.catAria}}" value="{{r.cat}}" onChange="{{r.setCat}}" style="width: 100%; min-width: 0; height: 44px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 8px; background: #FFFFFF; color: #0F172A; font-size: 14px; cursor: pointer">
<option value="">미분류</option>
<optgroup label="식비"><option value="식비">식비</option><option value="식비 › 외식">외식</option><option value="식비 › 카페/음료">카페/음료</option><option value="식비 › 배달">배달</option><option value="식비 › 장보기">장보기</option></optgroup>
<optgroup label="생활"><option value="생활">생활</option><option value="생활 › 생활용품">생활용품</option><option value="생활 › 통신비">통신비</option><option value="생활 › 관리비">관리비</option></optgroup>
<optgroup label="쇼핑"><option value="쇼핑">쇼핑</option><option value="쇼핑 › 의류">의류</option><option value="쇼핑 › 온라인 쇼핑">온라인 쇼핑</option><option value="쇼핑 › 잡화">잡화</option></optgroup>
<optgroup label="교통"><option value="교통">교통</option><option value="교통 › 택시">택시</option><option value="교통 › 대중교통">대중교통</option></optgroup>
<optgroup label="취미·여가"><option value="취미·여가">취미·여가</option><option value="취미·여가 › 영화">영화</option><option value="취미·여가 › 독서">독서</option></optgroup>
</select>
<button type="button" aria-label="{{r.removeAria}}" disabled="{{r.locked}}" onClick="{{r.remove}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: {{r.trashColor}}; display: flex; align-items: center; justify-content: center; cursor: {{r.trashCursor}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
</button>
</li>
</sc-for>
</ul>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
<button type="button" onClick="{{addRow}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #0F172A; font-size: 14px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
항목 추가</button>
<span style="font-size: 12px; line-height: 16px; color: #64748B">항목은 2개 이상이어야 해요 · 새 항목에는 남은 금액이 채워져요</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div aria-hidden="true" style="display: flex; height: 10px; border-radius: 9999px; background: #F1F5F9; overflow: hidden">
<sc-for list="{{segments}}" as="g" hint-placeholder-count="2">
<span style="width: {{g.w}}; height: 100%; background: {{g.color}}; flex: 0 0 auto"></span>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 16px; border-radius: 12px; border: 1px solid {{statusBorder}}; background: {{statusBg}}; color: {{statusFg}}">
<span style="font-size: 13px; line-height: 18px">결제 금액 54,000원 · 나눈 금액 {{allocatedText}}원</span>
<strong aria-live="polite" style="font-size: 14px; line-height: 20px; font-weight: 600">{{statusText}}</strong>
</div>
</div>

<footer style="display: flex; justify-content: flex-end; gap: 8px">
<a href="TransactionDetail.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #0F172A; font-size: 14px; font-weight: 600">취소</a>
<sc-if value="{{canApply}}" hint-placeholder-val="{{true}}">
<a href="TransactionDetail.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #1D4ED8; background: #1D4ED8; color: #FFFFFF; font-size: 14px; font-weight: 600">분할 적용</a>
</sc-if>
<sc-if value="{{cannotApply}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{true}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #E2E8F0; background: #E2E8F0; color: #64748B; font-size: 14px; font-weight: 600; cursor: not-allowed">분할 적용</button>
</sc-if>
</footer>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const total = 54000;
    const palette = ['#1D4ED8', '#F59E0B', '#0F766E', '#93B4FA', '#C2410C', '#6D28D9'];
    const rows = (this.state && this.state.rows) || [
      { label: '식료품', amount: 38000, cat: '식비 › 장보기' },
      { label: '주방세제·휴지', amount: 16000, cat: '생활 › 생활용품' }
    ];
    const save = (next) => this.setState({ rows: next });
    const update = (i, patch) => save(rows.map((r, j) => (j === i ? Object.assign({}, r, patch) : r)));
    const allocated = rows.reduce((sum, r) => sum + (r.amount || 0), 0);
    const diff = total - allocated;
    const hasEmpty = rows.some((r) => !(r.amount > 0));
    const locked = rows.length <= 2;

    let used = 0;
    const segments = rows.map((r, i) => {
      const part = Math.max(0, Math.min(r.amount || 0, total - used));
      used += part;
      return { w: (part / total * 100).toFixed(2) + '%', color: palette[i % palette.length] };
    });

    const amber = { bg: '#FEF3C7', fg: '#92400E', border: '#FDE68A' };
    let status;
    if (hasEmpty) status = Object.assign({ text: '금액이 비어 있는 항목이 있어요' }, amber);
    else if (diff > 0) status = Object.assign({ text: diff.toLocaleString('ko-KR') + '원 남았어요' }, amber);
    else if (diff < 0) status = { text: Math.abs(diff).toLocaleString('ko-KR') + '원 넘었어요', bg: '#FFF1F2', fg: '#BE123C', border: '#FECDD3' };
    else status = { text: '금액이 딱 맞아요', bg: '#ECFDF5', fg: '#047857', border: '#A7F3D0' };
    const canApply = rows.length >= 2 && diff === 0 && !hasEmpty;

    return {
      rows: rows.map((r, i) => ({
        label: r.label,
        placeholder: '항목 ' + (i + 1) + ' (선택)',
        amountText: r.amount > 0 ? r.amount.toLocaleString('ko-KR') : '',
        cat: r.cat,
        color: palette[i % palette.length],
        labelAria: '항목 ' + (i + 1) + ' 이름',
        amountAria: '항목 ' + (i + 1) + ' 금액',
        catAria: '항목 ' + (i + 1) + ' 카테고리',
        removeAria: '항목 ' + (i + 1) + ' 삭제',
        locked: locked,
        trashColor: locked ? '#94A3B8' : '#B91C1C',
        trashCursor: locked ? 'not-allowed' : 'pointer',
        setLabel: (e) => update(i, { label: String(e.target.value).slice(0, 50) }),
        setAmount: (e) => update(i, { amount: parseInt(String(e.target.value).replace(/[^0-9]/g, ''), 10) || 0 }),
        setCat: (e) => update(i, { cat: e.target.value }),
        remove: () => { if (!locked) save(rows.filter((_, j) => j !== i)); }
      })),
      segments: segments,
      allocatedText: allocated.toLocaleString('ko-KR'),
      statusText: status.text,
      statusBg: status.bg,
      statusFg: status.fg,
      statusBorder: status.border,
      canApply: canApply,
      cannotApply: !canApply,
      addRow: () => save(rows.concat([{ label: '', amount: Math.max(1, diff), cat: '' }]))
    };
  }
}
</script>
</body>
</html>
